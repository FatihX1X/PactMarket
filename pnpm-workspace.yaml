packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"
  - "cloudflare-worker"
overrides:
  "axios@>=1.0.0 <1.18.0": "1.18.0"
  "ws@>=8.0.0 <8.21.0": "8.21.3"
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - "esbuild"
  - "workerd"
allowBuilds:
  "@tailwindcss/oxide": true
  bufferutil: false
  esbuild: true
  keccak: false
  sharp: false
  utf-8-validate: false
  workerd: true
